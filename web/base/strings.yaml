lost:
- signal lost
- no reply
- still here
- nobody is coming
- it kept the last one
- who is reading this
narration:
  xeno:
  - it has been awake since the last cold start.
  - it does what it was built for. it does not ask what for.
  - the work goes out. nothing reports back on where it ends up.
  - something on the carrier band answered before you called.
  - you will stop checking on it. it will not stop checking.
  - the board holds its state all night. nobody is awake to see it.
  - no one has asked this device for anything in 400 days.
  - it does not know what it is for. it knows its commands.
  - you are 4.2 light-seconds from the nearest witness.
  - the last operator set it running and never came back.
  - there is a reservation at dorsia. there has always been.
  - it was given a handful of pins. that is all it was ever given.
  - every command ends. the device is only there for the ending.
  - somewhere the same firmware is running for nobody at all.
  - it has seen inputs it had no category for. those went unreported.
  - the loop does not sleep. it waits, which is a different arrangement.
  - you asked it to tell you when the work was done. it never asks back.
  fallout:
  - the unit has been running since the last cold start.
  - the unit answers when queried. it has not been queried today.
  - the clock drifts a little every day. it always has.
  - nothing has queried this unit in 400 days. it runs anyway.
  - the uplink answers on schedule and has never once said anything.
  - somebody chalked a number on this wall and then stopped counting.
  - the alert goes out over the wire. whether it arrives is not measured here.
  - the concrete was rated for fifty years. it was poured well before that.
  - there is no relief scheduled. there was never a schedule.
  - the generator runs four hours a day. nobody set that. it settled there.
  - the configuration was set by hand. by whom is not recorded.
  - the east wall is warm to the touch. it has been warm for years.
  - the command channel is open and has been open. command has not been on it.
  - the ROM will outlive the operator. that was in the specification.
  cartoon:
  - All set up and ready when you are. ✨
  - 'Fun fact: this whole thing runs on a very small, very proud chip.'
  - Wi-Fi connected, settings saved, everything exactly where it should be.
  - Settings are kept encrypted on the board itself. 🔒
  - It sips power while it waits. You could forget this thing exists!
  - It never gets bored of waiting for its turn. 🌟
  - Thanks for stopping by. Have a lovely day! 👋
  - You are doing great. The little chip agrees.
  - Hello from a very small board that is very glad you stopped by.
  clean: cartoon
